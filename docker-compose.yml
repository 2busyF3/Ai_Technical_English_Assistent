services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: tutor
      POSTGRES_USER: tutor
      POSTGRES_PASSWORD: tutor
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tutor"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    volumes: [redis_data:/data]
  backend:
    build: ./backend
    command: ["/app/entrypoint.sh", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://tutor:tutor@postgres:5432/tutor
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
    ports: ["8001:8000"]
    restart: on-failure:5
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
  worker:
    build: ./backend
    command: ["dramatiq", "app.workers", "--processes", "2", "--threads", "4"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://tutor:tutor@postgres:5432/tutor
      REDIS_URL: redis://redis:6379/0
    depends_on:
      backend: {condition: service_healthy}
      redis: {condition: service_started}
    restart: on-failure:5
  frontend:
    build: ./frontend
    depends_on:
      backend: {condition: service_healthy}
    ports: ["5173:80"]
    restart: on-failure:5
volumes:
  postgres_data:
  redis_data:
